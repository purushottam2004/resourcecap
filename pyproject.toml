[project]
name = "resourcecap"
version = "0.1.0"
description = "A python package to limit the resource usage of any program"
readme = "README.md"
authors = [
    { name = "purushottam-dafure", email = "purushottamdafure@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
resourcecap = "resourcecap:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
]

[tool.ruff.lint.isort]
known-first-party = ["resourcecap"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
